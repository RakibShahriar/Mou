
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My fav view</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
</head>

<script>
    document.querySelectorAll('a').forEach(function(link) {

        link.addEventListener('click', function(event) {

            const destination = link.getAttribute('href');

            if (
                destination &&
                destination !== '#' &&
                !destination.startsWith('javascript:')
            ) {
                event.preventDefault();

                document.body.classList.add('page-leaving');

                setTimeout(function() {
                    window.location.href = link.href;
                }, 500);
            }

        });

    });
</script>

<body class="page9-body">

    <div class="page9-container">

        <h1 class="page9-heading">My fav view</h1>

        <div class="page9-left-text">
            You will always be my most chesrtished and the person who always comforts my heart.
        </div>

        <div class="page9-right-text">
            Wish I was the same for you.
        </div>

        <a href="{{ url_for('page8') }}" class="page9-previous-button">
            Previous ❤️
        </a>

        <a href="{{ url_for('page10') }}" class="page9-next-button">
            Next ❤️
        </a>

    </div>

</body>
</html>
